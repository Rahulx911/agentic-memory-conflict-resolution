[project]
name = "agentic-memory-conflict-resolution"
version = "0.1.0"
description = "Agentic system with long-term memory and conflict resolution across sessions"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-anthropic",
    "anthropic",
    "psycopg[binary]",
    "sqlalchemy>=2",
    "qdrant-client",
    "voyageai",
    "pydantic>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "streamlit",  # tests/test_ui_app.py drives src/ui/app.py headlessly via streamlit.testing
]
ui = [
    "streamlit",
]

[tool.ruff]
line-length = 100
